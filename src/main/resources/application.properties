spring.application.name=ledgerpay

spring.datasource.url=jdbc:mysql://localhost:3306/ledgerpay?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:PLACEHOLDER_SET_DB_PASSWORD_ENV_VAR}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:PLACEHOLDER_SET_JWT_SECRET_ENV_VAR}
jwt.expiration=86400000